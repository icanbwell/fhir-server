name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  VERSION_RE: '^[0-9]+\.[0-9]+\.[0-9]+$'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute next version
        id: version
        run: |
          if git tag --points-at "$GITHUB_SHA" | grep -qE "$VERSION_RE"; then
            echo "Commit already has a version tag, nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREVIOUS=$(git tag -l | grep -E "$VERSION_RE" | sort -V | tail -1)
          if [ -z "$PREVIOUS" ]; then
            echo "No version tag found, refusing to invent a starting version" >&2
            exit 1
          fi
          NEXT="${PREVIOUS%.*}.$(( ${PREVIOUS##*.} + 1 ))"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
      - name: Create release
        if: ${{ steps.version.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          gh release create "$NEXT" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --generate-notes \
            --notes-start-tag "$PREVIOUS"
      - name: Publish Docker image
        if: ${{ steps.version.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: gh workflow run publish_docker.yml --ref main -f tag="$NEXT"
