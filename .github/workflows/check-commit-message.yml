name: 'Commit Message Check'
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main, 'releases/*']

jobs:
  check-commit-message:
    name: Check Commit Message
    runs-on: ubuntu-latest
    steps:
      - name: Check For Issue Key
        uses: gsactions/commit-message-checker@v2
        with:
          pattern: '^(Bump|Merge|Revert|Reapply|fix\(security\):|\[Aikido\]|build\(deps(-dev)?\): bump|([A-Z]+-[0-9]+))\s+.+'
          flags: 'gm'
          error: 'Commit message must begin with a JIRA Issue Key: e.g. HP-123 <message>'

      - name: Reject AI attribution in commits/PR description
        uses: actions/github-script@v7
        with:
          script: |
            // AGENTS.md "Code ownership": no Co-Authored-By/Generated-by/AI attribution
            // in commits, PRs, or comments — the author on the commit is the owner.
            // Tool name list, not just "claude" — the rule bans AI attribution generically.
            const AI_TOOL = '(?:claude|chatgpt|gpt-\\d|copilot|codex|gemini|cursor|windsurf|devin|cody|tabnine|bard|anthropic|openai)';
            const BAD_PATTERN = new RegExp(
              `co-authored-by:[^\\n]*${AI_TOOL}` +
              `|generated\\s+(with|by)\\s*\\[?${AI_TOOL}` +
              `|🤖\\s*generated\\s+with`,
              'i'
            );
            const violations = [];

            let messages = [];
            if (context.eventName === 'pull_request') {
              // github.paginate, not a single per_page:100 call — PRs can exceed 100 commits.
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
              messages = commits.map(c => ({ ref: c.sha.slice(0, 7), text: c.commit.message }));
              if (context.payload.pull_request.body && BAD_PATTERN.test(context.payload.pull_request.body)) {
                violations.push('PR description');
              }
            } else if (context.eventName === 'push') {
              // The push webhook payload's `commits` array is capped at 20 entries by GitHub,
              // regardless of how many commits were actually pushed — resolve the full range
              // via the compare API instead, keyed off before/after SHAs.
              const before = context.payload.before;
              const after = context.payload.after;
              if (before && after && !/^0+$/.test(before)) {
                const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: `${before}...${after}`,
                });
                messages = comparison.commits.map(c => ({ ref: c.sha.slice(0, 7), text: c.commit.message }));
              } else if (context.payload.commits) {
                messages = context.payload.commits.map(c => ({ ref: c.id.slice(0, 7), text: c.message }));
              }
            }

            for (const m of messages) {
              if (BAD_PATTERN.test(m.text)) {
                violations.push(`commit ${m.ref}`);
              }
            }

            if (violations.length) {
              core.setFailed(
                'No "Co-Authored-By", "Generated by/with Claude", or other AI attribution allowed in commits, ' +
                'PRs, or comments (AGENTS.md "Code ownership" — the author on the commit is the owner). ' +
                `Found in: ${violations.join(', ')}. Remove it (amend/rebase the commit, or edit the PR description) and push again.`
              );
            }
